behaviors:
  CombinedVisual:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

environment_parameters:
  maze_difficulty:
    curriculum:
      - name: Lesson0_Small_NoHazards
        completion_criteria:
          measure: reward
          behavior: CombinedVisual
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.5
        value: 0.0
      - name: Lesson1_Medium_NoHazards
        completion_criteria:
          measure: reward
          behavior: CombinedVisual
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.5
        value: 1.0
      - name: Lesson2_Medium_OneHazard
        completion_criteria:
          measure: reward
          behavior: CombinedVisual
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.4
        value: 2.0
      - name: Lesson3_Full_TwoHazards
        value: 3.0
